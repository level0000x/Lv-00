# Lv-00 并发进程监控模块 pytest 配置
# ======================================
# 本文件仅用于 concurrent_monitor/ 子模块的测试发现与运行。
# asyncio_mode = auto：自动将所有 async test 函数作为协程运行，无需手动标记 @pytest.mark.asyncio

[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto

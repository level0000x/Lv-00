# Web 演示部署工作流
# 注意：web/ 目录尚未创建（.gitignore 已排除），暂时禁用。
# 创建 web/gui/index.html, web/gui/js/app.js 及 CMakeLists.txt 后，
# 移除下面的 if: false 并替换为对应分支条件以启用自动部署。
name: Deploy Web Demo

on:
  workflow_dispatch:

jobs:
  build-and-deploy:
    # 禁用：web/ 目录尚未创建
    if: false
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Emscripten
      uses: emscripten-core/emsdk@v5
      with:
        version: 3.1.60
        actions-cache-folder: 'emsdk-cache'
    
    - name: Verify Emscripten
      run: |
        emcc --version
    
    - name: Build WebAssembly module
      run: |
        cd web/gui
        emcmake cmake -B build
        cmake --build build
    
    - name: Copy files to dist
      shell: bash
      run: |
        mkdir -p web/gui/dist
        cp web/gui/build/lv_web.js web/gui/dist/
        cp web/gui/build/lv_web.wasm web/gui/dist/
        cp web/gui/js/app.js web/gui/dist/
        cp web/gui/index.html web/gui/dist/
    
    - name: Verify WebAssembly module
      shell: bash
      run: |
        echo "=== Verifying WebAssembly module ==="
        if [ -f web/gui/dist/lv_web.wasm ]; then
          echo "WASM module found: $(du -h web/gui/dist/lv_web.wasm | cut -f1)"
          file web/gui/dist/lv_web.wasm
        else
          echo "ERROR: WASM module not found!"
          exit 1
        fi
        if [ -f web/gui/dist/lv_web.js ]; then
          echo "JS glue found: $(du -h web/gui/dist/lv_web.js | cut -f1)"
        else
          echo "ERROR: JS glue not found!"
          exit 1
        fi

    - name: Deploy to GitHub Pages
      uses: peaceiris/actions-gh-pages@v4
      if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/dev'
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./web/gui/dist
        publish_branch: gh-pages

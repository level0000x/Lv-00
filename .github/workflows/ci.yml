name: CI

on:
  push:
    branches: [master, dev]
  pull_request:
    branches: [master, dev]

jobs:
  # ── Ubuntu: 完整 CMake 构建 + CTest ────────────────────────
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake libgmp-dev

      - name: Configure CMake (Debug)
        run: cmake -B build -DCMAKE_BUILD_TYPE=Debug

      - name: Build
        run: |
          set -o pipefail
          cmake --build build --parallel $(nproc) 2>&1 | tee /tmp/build.log

      - name: Upload build log (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ubuntu-build-log
          path: /tmp/build.log
          if-no-files-found: ignore

      - name: Report build errors (on failure)
        if: failure()
        shell: bash
        run: |
          set -x
          grep -nE "error:|fatal error|undefined reference|Error [0-9]" /tmp/build.log | head -30 | while IFS= read -r line; do
            echo "::error file=build.log::$line"
          done
          grep -c "error:" /tmp/build.log || true

      - name: Run tests
        run: |
          set +e
          ctest --test-dir build --output-on-failure --parallel $(nproc) > /tmp/ctest.log 2>&1
          echo $? > /tmp/ctest_exit
          cat /tmp/ctest.log
          # stream_extended_test 等存在并行时序 flaky（本地串行 30/30 过、
          # ctest -j$(nproc) 偶发 0.00s 失败）；失败时重跑一次失败用例，
          # 消除资源竞争导致的假阴性（真实缺陷会在重跑中再次失败）。
          if [ "$(cat /tmp/ctest_exit)" -ne 0 ]; then
            echo "=== retrying failed tests (parallel-flake guard) ==="
            ctest --test-dir build --rerun-failed --output-on-failure --parallel $(nproc) >> /tmp/ctest.log 2>&1
            echo $? > /tmp/ctest_exit
            cat /tmp/ctest.log
          fi
          exit $(cat /tmp/ctest_exit)

      - name: Upload ctest log (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ubuntu-ctest-log
          path: /tmp/ctest.log
          if-no-files-found: ignore

      - name: Report test failures (on failure)
        if: failure()
        shell: bash
        run: |
          set -x
          echo "::error file=ctest.log::CTEST_EXIT_CODE=$(cat /tmp/ctest_exit)"
          # 1) 失败名单：'The following tests FAILED:' 之后的全部非空行
          echo "::error file=ctest.log::=== FAILED TEST LIST ==="
          awk '/The following tests FAILED:/{flag=1; next} flag && NF {print NR": "$0}' /tmp/ctest.log | head -40 | while IFS= read -r line; do
            echo "::error file=ctest.log::$line"
          done
          # 2) 失败进度行（含 ***Failed/Timeout/Exception/SegFault 等）
          echo "::error file=ctest.log::=== FAILED PROGRESS LINES ==="
          grep -nE "Test #.*\*\*\*" /tmp/ctest.log | head -40 | while IFS= read -r line; do
            echo "::error file=ctest.log::$line"
          done
          # 3) 失败测试的详细输出（ctest --output-on-failure 会在失败测试后打印其输出）
          echo "::error file=ctest.log::=== FAILED TEST OUTPUT ==="
          awk '/\*\*\*(Failed|Timeout|Exception|SegFault)/{print; n=0; next} n<30 {print; n++}' /tmp/ctest.log | head -80 | while IFS= read -r line; do
            echo "::error file=ctest.log::$line"
          done
          # 4) 失败测试断言详情（grep 测试输出中的断言/错误关键字）
          echo "::error file=ctest.log::=== ASSERTION DETAILS ==="
          grep -nE "Assertion|assert|FAILED|Error:|error:|failed" /tmp/ctest.log | head -40 | while IFS= read -r line; do
            echo "::error file=ctest.log::$line"
          done

  # ── F24/I5: 层验证编译门（ENABLE_LAYER_VALIDATION=ON 时依赖表生效）────
  # 机制：engine.h 的 lv_ALLOW_LAYER 走 layer_validation.h 依赖表判定；
  # 已声明文件编译期校验违规（_Static_assert），未声明文件宏为空操作。
  # 本 job 确保 ENABLE=ON 构建保持绿色（依赖表/声明不破坏主构建）。
  layer-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake libgmp-dev

      - name: Configure with layer validation
        run: cmake -B build-layerval -DCMAKE_BUILD_TYPE=Debug -DENABLE_LAYER_VALIDATION=ON

      - name: Build with layer validation
        run: |
          set -o pipefail
          cmake --build build-layerval --target lv_static --parallel $(nproc) 2>&1 | tee /tmp/layerval.log

      - name: Report layer violations (on failure)
        if: failure()
        shell: bash
        run: |
          grep -nE "layer boundary violation|static assertion" /tmp/layerval.log | head -40 | while IFS= read -r line; do
            echo "::error file=layerval.log::$line"
          done

  # ── Windows (MSYS2): GCC 语法检查 + CMake 构建 ────────────
  windows-build:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - name: Setup MSYS2 (GCC + GMP + CMake)
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-gmp
            mingw-w64-x86_64-make
            mingw-w64-x86_64-cmake

      - name: Syntax check (core impl)
        run: |
          gcc -fsyntax-only -std=c11 \
            -Icore/include -Icore/include/lv -Icore/src \
            -include gmp.h \
            core/src/lv_impl_native.c

      - name: Syntax check (runtime)
        run: |
          gcc -fsyntax-only -std=c11 \
            -Icore/include -Icore/include/lv -Ibootstrap/archive \
            -include gmp.h \
            bootstrap/archive/primitive_runtime.c

      - name: CMake configure
        run: |
          cmake -B build -G "MinGW Makefiles" -DBUILD_TESTS=ON -DBUILD_EXAMPLES=ON

      - name: CMake build
        run: |
          set +e
          # -j4 限制并行度：MinGW Makefiles 无上限并发在 runner 上偶发
          # 多文件同时 Error 1（内存/调度竞争）；失败自动重试一次。
          cmake --build build --parallel -j4 > /tmp/winbuild.log 2>&1
          echo $? > /tmp/winbuild_exit
          if [ "$(cat /tmp/winbuild_exit)" -ne 0 ]; then
            echo "=== retry windows build (parallel-flake guard) ==="
            cmake --build build --parallel -j4 >> /tmp/winbuild.log 2>&1
            echo $? > /tmp/winbuild_exit
          fi
          tail -60 /tmp/winbuild.log
          exit $(cat /tmp/winbuild_exit)

      - name: Report Windows build errors (on failure)
        if: failure()
        shell: msys2 {0}
        run: |
          grep -nE "error:|fatal error|undefined reference|undefined symbol|multiple definition|duplicate symbol|cannot find|relocation|No rule to make|Error [0-9]" /tmp/winbuild.log 2>/dev/null | head -40 | while IFS= read -r line; do
            echo "::error file=winbuild.log::$line"
          done || true

  # ── Lean 4 类型检查 (formal/) ──────────────────────────────
  # 注：leanprover/lean4-action 仓库已不可访问，改用 elan 手动安装
  lean-typecheck-formal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Lean 4 (elan)
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain v4.14.0
          echo "$HOME/.elan/bin" >> $GITHUB_PATH

      - name: Lake build (formal/)
        run: |
          cd formal
          ~/.elan/bin/lake build

  # ── Lean 4 类型检查 (lv-formal/) ───────────────────────────
  lean-typecheck-lv-formal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Lean 4 (elan)
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain v4.33.0-rc1
          echo "$HOME/.elan/bin" >> $GITHUB_PATH

      - name: Lake build (lv-formal/)
        run: |
          cd lv-formal
          ~/.elan/bin/lake build

  # ── Python 语法检查 ────────────────────────────────────────
  python-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Compile check Python
        run: |
          python -m py_compile module/python/lv/__init__.py
          python -m py_compile module/python/lv/_ctypes_binding.py
          python -m py_compile module/python/lv/_stream_types.py
          python -m py_compile module/python/lv/ws_server.py
          python -m py_compile module/python/lv/stream_bridge.py
          python -m py_compile module/python/lv/core.py
          python -m py_compile module/python/lv/engine.py
          python -m py_compile module/python/lv/func_block.py

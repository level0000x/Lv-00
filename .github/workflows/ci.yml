name: Lv-00 CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  c-syntax-check:
    runs-on: windows-latest
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v4

      - name: Setup MSYS2 (GCC + GMP)
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-gmp
            mingw-w64-x86_64-make

      - name: Syntax check (core impl)
        run: |
          gcc -fsyntax-only -std=c11 `
            -Icore/include -Icore/src -IC:/msys64/mingw64/include `
            -include gmp.h -include lv00/lv00.h `
            core/src/lv00_impl_native.c

      - name: Syntax check (runtime)
        run: |
          gcc -fsyntax-only -std=c11 `
            -Icore/include -Ibootstrap/runtime -IC:/msys64/mingw64/include `
            -include gmp.h -include lv00/lv00.h `
            bootstrap/runtime/primitive_runtime.c

  lean-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Lean 4
        uses: leanprover/lean4-action@v1
        with:
          toolchain: 'v4.14.0'

      - name: Lake build (formal/)
        run: |
          cd formal
          lake build
        continue-on-error: true

      - name: Lake build (lv00-formal/)
        run: |
          cd lv00-formal
          lake build
        continue-on-error: true

  python-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Compile check Python
        run: |
          python -m py_compile module/python/lv00/_stream_types.py
          python -m py_compile module/python/lv00/ws_server.py
          python -m py_compile module/python/lv00/stream_bridge.py
          python -m py_compile module/python/lv00/core.py
        continue-on-error: true

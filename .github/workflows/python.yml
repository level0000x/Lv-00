name: Python Bindings

on:
  push:
    branches: [master, dev]
  pull_request:
    branches: [master, dev]

jobs:
  test-python:
    runs-on: ${{ matrix.os }}
    strategy:
      # 矩阵策略：每个操作系统仅测试 2 个 Python 版本（3.10 和 3.13），
      # 覆盖旧版兼容性与最新特性，避免 CI 矩阵膨胀浪费资源。
      # 3.8 已于 2024-10 停止维护（EOL），不再测试。
      # 如需完整兼容性验证，可临时添加 3.9 / 3.11 / 3.12 到矩阵中。
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.10', '3.13']

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies (Ubuntu)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake libgmp-dev

    - name: Install dependencies (macOS)
      if: runner.os == 'macOS'
      run: |
        brew install cmake gmp

    - name: Install dependencies (Windows)
      if: runner.os == 'Windows'
      uses: msys2/setup-msys2@v2
      with:
        update: true
        install: >-
          mingw-w64-x86_64-gcc
          mingw-w64-x86_64-cmake
          mingw-w64-x86_64-make
          mingw-w64-x86_64-gmp
    - name: Build shared library (Ubuntu/macOS)
      if: runner.os != 'Windows'
      run: |
        cmake -B build -DBUILD_SHARED_LIBS=ON -DBUILD_TESTS=OFF -DBUILD_EXAMPLES=OFF
        set +e
        cmake --build build --parallel > /tmp/pybuild.log 2>&1
        echo $? > /tmp/pybuild_exit
        cat /tmp/pybuild.log
        exit $(cat /tmp/pybuild_exit)

    - name: Report build errors (on failure)
      if: failure() && runner.os != 'Windows'
      shell: bash
      run: |
        set -x
        grep -nE "error:|fatal error|undefined reference|undefined symbol|multiple definition|duplicate symbol|cannot find|relocation|ld returned|Error [0-9]" /tmp/pybuild.log 2>/dev/null | head -50 | while IFS= read -r line; do
          echo "::error file=pybuild.log::$line"
        done || true
        # 链接错误上下文：collect2/ld 附近的原始行
        echo "::error file=pybuild.log::=== LD CONTEXT ==="
        grep -n -B3 -A8 "collect2\|ld returned" /tmp/pybuild.log 2>/dev/null | head -60 | while IFS= read -r line; do
          echo "::error file=pybuild.log::$line"
        done || true

    - name: Build shared library (Windows)
      if: runner.os == 'Windows'
      shell: msys2 {0}
      run: |
        cmake -B build -G "MinGW Makefiles" -DBUILD_SHARED_LIBS=ON -DBUILD_TESTS=OFF -DBUILD_EXAMPLES=OFF > /tmp/wincfg.log 2>&1
        echo "configure exit: $?" | tee -a /tmp/wincfg.log
        set +e
        cmake --build build --parallel > /tmp/winbuild.log 2>&1
        echo $? > /tmp/winbuild_exit
        cat /tmp/winbuild_exit
        tail -40 /tmp/wincfg.log
        tail -60 /tmp/winbuild.log
        exit $(cat /tmp/winbuild_exit)

    - name: Report build errors (Windows, on failure)
      if: failure() && runner.os == 'Windows'
      shell: msys2 {0}
      run: |
        echo "::error file=wincfg.log::=== CONFIGURE LOG (tail) ==="
        tail -40 /tmp/wincfg.log 2>/dev/null | while IFS= read -r line; do
          echo "::error file=wincfg.log::$line"
        done || true
        echo "::error file=wincfg.log::=== CONFIGURE ERRORS ==="
        grep -nE "error|Error|fatal|not found|Failed" /tmp/wincfg.log 2>/dev/null | head -30 | while IFS= read -r line; do
          echo "::error file=wincfg.log::$line"
        done || true
        echo "::error file=winbuild.log::=== BUILD LOG (tail) ==="
        tail -60 /tmp/winbuild.log 2>/dev/null | while IFS= read -r line; do
          echo "::error file=winbuild.log::$line"
        done || true

    - name: Install Python package
      working-directory: module/python
      shell: bash
      run: |
        set +e
        if [ "${{ runner.os }}" == "Windows" ]; then
          # Windows 仅保留构建验证，Python 测试由 Ubuntu/macOS 覆盖；
          # 安装依赖供 flake8/mypy 使用（官方 python，不依赖 liblv.dll）
          pip install -q pytest pytest-cov flake8 mypy pytest-asyncio 2>&1 | tail -3
          exit 0
        fi
        pip install -e .
        pip install pytest pytest-cov flake8 mypy pytest-asyncio
        # concurrent_monitor / llm_coding_assistant 测试依赖（rich/flask/fastapi 等）
        pip install -r ../concurrent_monitor/requirements.txt
        pip install -r ../llm_coding_assistant/requirements.txt || true

    # ── 静态代码检查：flake8 + mypy ──────────────────────────────────
    # 在运行测试之前先进行代码质量检查，尽早发现风格和类型问题
    - name: Run flake8 linting
      shell: bash
      run: |
        # 检查 module/concurrent_monitor/ 和 module/llm_coding_assistant/ 目录的代码风格
        flake8 module/concurrent_monitor/ module/llm_coding_assistant/ \
          --count --select=E9,F63,F7,F82 --show-source --statistics > /tmp/flake8.log 2>&1
        rc=$?
        cat /tmp/flake8.log
        if [ $rc -ne 0 ]; then
          echo "::error file=flake8.log::flake8 fatal-check failed (exit $rc)"
          tail -40 /tmp/flake8.log | while IFS= read -r line; do
            echo "::error file=flake8.log::$line"
          done
          exit $rc
        fi
        # E9/F63/F7/F82: 仅报告致命语法错误和导入错误
        echo "flake8 致命错误检查通过"
        # 完整风格检查（非阻塞，仅输出警告）
        flake8 module/concurrent_monitor/ module/llm_coding_assistant/ \
          --count --exit-zero --max-complexity=10 --max-line-length=100 --statistics \
          || echo "flake8 风格警告已输出（非阻塞）"

    - name: Run mypy type checking
      shell: bash
      run: |
        # 对 module/concurrent_monitor/ 和 module/llm_coding_assistant/ 进行类型检查
        mypy module/concurrent_monitor/ --ignore-missing-imports --no-error-summary || true
        mypy module/llm_coding_assistant/ --ignore-missing-imports --no-error-summary || true
        echo "mypy 类型检查完成（非阻塞模式）"

    - name: Set library path (Ubuntu/macOS)
      if: runner.os != 'Windows'
      run: |
        echo "lv_LIBRARY_PATH=$PWD/build/liblv.so" >> $GITHUB_ENV
        if [ "${{ runner.os }}" == "macOS" ]; then
          echo "lv_LIBRARY_PATH=$PWD/build/liblv.dylib" >> $GITHUB_ENV
        fi

    - name: Set library path (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        echo "lv_LIBRARY_PATH=$pwd/build/liblv.dll" >> $env:GITHUB_ENV

    - name: Run Python tests
      working-directory: module/python
      shell: bash
      run: |
        # Windows: 官方 Python（UCRT）无法加载 MSYS2 GCC（MSVCRT）构建的
        # liblv.dll（CRT 不匹配，ctypes 加载即失败）；改用 MSYS2 python 会
        # 引入 MSYS2 包缓存竞争。Ubuntu/macOS 已覆盖 Python 绑定测试，
        # Windows 仅保留共享库构建验证（见上方 Build shared library 步骤）。
        if [ "${{ runner.os }}" == "Windows" ]; then
          echo "Skipping Python tests on Windows (MSYS2-DLL vs official-Python CRT mismatch; covered by Ubuntu/macOS)"
          exit 0
        fi
        set +e
        export PYTHONUNBUFFERED=1
        python -X faulthandler -m pytest tests/ -v --cov=lv --cov-report=xml > /tmp/pytest.log 2>&1
        echo $? > /tmp/pytest_exit
        cat /tmp/pytest.log
        exit $(cat /tmp/pytest_exit)

    - name: Report pytest failures (on failure)
      if: failure()
      shell: bash
      run: |
        set -x
        echo "::error file=collect.log::=== COLLECT LOG ==="
        cat /tmp/collect.log 2>/dev/null | while IFS= read -r line; do
          echo "::error file=collect.log::$line"
        done || true
        echo "::error file=pytest.log::=== pytest log FULL ==="
        cat /tmp/pytest.log 2>/dev/null | while IFS= read -r line; do
          echo "::error file=pytest.log::$line"
        done || true

    - name: Run concurrent_monitor tests
      working-directory: module/concurrent_monitor
      shell: bash
      run: |
        set +e
        python -m pytest tests/ -v > /tmp/concurrent.log 2>&1
        echo $? > /tmp/concurrent_exit
        tail -100 /tmp/concurrent.log
        exit $(cat /tmp/concurrent_exit)

    - name: Report concurrent_monitor failures (on failure)
      if: failure()
      shell: bash
      run: |
        set -x
        grep -nE "FAILED|ERROR|error:|assert|AssertionError|ImportError|ModuleNotFoundError|No module|Exception" /tmp/concurrent.log 2>/dev/null | head -40 | while IFS= read -r line; do
          echo "::error file=concurrent.log::$line"
        done || true

    - name: Run llm_coding_assistant tests
      working-directory: module/llm_coding_assistant
      shell: bash
      run: |
        python -m pytest tests/ -v || echo "No tests yet"

    - name: Upload coverage
      uses: codecov/codecov-action@v5
      with:
        files: module/python/coverage.xml
        flags: python
        fail_ci_if_error: false

    - name: Run example
      working-directory: module/python
      shell: bash
      run: |
        # Windows 跳过：liblv.dll 为 MSYS2 构建，官方 Python 无法加载（CRT 不匹配）
        if [ "${{ runner.os }}" == "Windows" ]; then
          echo "Skipping example on Windows (CRT mismatch, covered by Ubuntu/macOS)"
          exit 0
        fi
        set +e
        python examples/basic_usage.py > /tmp/example.log 2>&1
        echo $? > /tmp/example_exit
        tail -60 /tmp/example.log
        exit $(cat /tmp/example_exit)

    - name: Report example failures (on failure)
      if: failure()
      shell: bash
      run: |
        set -x
        grep -nE "Error|Traceback|assert|Exception|error" /tmp/example.log 2>/dev/null | head -30 | while IFS= read -r line; do
          echo "::error file=example.log::$line"
        done || true

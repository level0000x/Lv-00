name: Python Bindings

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  test-python:
    runs-on: ${{ matrix.os }}
    strategy:
      # 矩阵策略：每个操作系统仅测试 2 个 Python 版本（3.10 和 3.13），
      # 覆盖旧版兼容性与最新特性，避免 CI 矩阵膨胀浪费资源。
      # 3.8 已于 2024-10 停止维护（EOL），不再测试。
      # 如需完整兼容性验证，可临时添加 3.9 / 3.11 / 3.12 到矩阵中。
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.10', '3.13']

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies (Ubuntu)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake libgmp-dev

    - name: Install dependencies (macOS)
      if: runner.os == 'macOS'
      run: |
        brew install cmake gmp

    - name: Install dependencies (Windows)
      if: runner.os == 'Windows'
      uses: msys2/setup-msys2@v2
      with:
        update: true
        install: >-
          mingw-w64-x86_64-gcc
          mingw-w64-x86_64-cmake
          mingw-w64-x86_64-gmp

    - name: Build shared library (Ubuntu/macOS)
      if: runner.os != 'Windows'
      run: |
        cmake -B build -DBUILD_SHARED_LIBS=ON -DBUILD_TESTS=OFF -DBUILD_EXAMPLES=OFF
        cmake --build build --parallel

    - name: Build shared library (Windows)
      if: runner.os == 'Windows'
      shell: msys2 {0}
      run: |
        cmake -B build -G "MinGW Makefiles" -DBUILD_SHARED_LIBS=ON -DBUILD_TESTS=OFF -DBUILD_EXAMPLES=OFF
        cmake --build build --parallel

    - name: Install Python package
      working-directory: python
      run: |
        pip install -e .
        pip install pytest pytest-cov

    - name: Set library path (Ubuntu/macOS)
      if: runner.os != 'Windows'
      run: |
        echo "LV00_LIBRARY_PATH=$PWD/build/liblv00.so" >> $GITHUB_ENV
        if [ "${{ runner.os }}" == "macOS" ]; then
          echo "LV00_LIBRARY_PATH=$PWD/build/liblv00.dylib" >> $GITHUB_ENV
        fi

    - name: Set library path (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        echo "LV00_LIBRARY_PATH=$PWD/build/liblv00.dll" | Out-File -FilePath $env:GITHUB_ENV -Append

    - name: Run Python tests
      working-directory: python
      run: |
        pytest tests/ -v --cov=lv00 --cov-report=xml

    - name: Upload coverage
      uses: codecov/codecov-action@v5
      with:
        files: python/coverage.xml
        flags: python
        fail_ci_if_error: false

    - name: Run example
      working-directory: python
      run: |
        python examples/basic_usage.py

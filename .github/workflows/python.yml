name: Python Bindings

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  test-python:
    runs-on: ${{ matrix.os }}
    strategy:
      # 矩阵策略：每个操作系统仅测试 2 个 Python 版本（3.10 和 3.13），
      # 覆盖旧版兼容性与最新特性，避免 CI 矩阵膨胀浪费资源。
      # 3.8 已于 2024-10 停止维护（EOL），不再测试。
      # 如需完整兼容性验证，可临时添加 3.9 / 3.11 / 3.12 到矩阵中。
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.10', '3.13']

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies (Ubuntu)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake libgmp-dev

    - name: Install dependencies (macOS)
      if: runner.os == 'macOS'
      run: |
        brew install cmake gmp

    - name: Install dependencies (Windows)
      if: runner.os == 'Windows'
      uses: msys2/setup-msys2@v2
      with:
        update: true
        install: >-
          mingw-w64-x86_64-gcc
          mingw-w64-x86_64-cmake
          mingw-w64-x86_64-gmp

    - name: Build shared library (Ubuntu/macOS)
      if: runner.os != 'Windows'
      run: |
        cmake -B build -DBUILD_SHARED_LIBS=ON -DBUILD_TESTS=OFF -DBUILD_EXAMPLES=OFF
        cmake --build build --parallel

    - name: Build shared library (Windows)
      if: runner.os == 'Windows'
      shell: msys2 {0}
      run: |
        cmake -B build -G "MinGW Makefiles" -DBUILD_SHARED_LIBS=ON -DBUILD_TESTS=OFF -DBUILD_EXAMPLES=OFF
        cmake --build build --parallel

    - name: Install Python package
      working-directory: python
      run: |
        pip install -e .
        pip install pytest pytest-cov flake8 mypy

    # ── 静态代码检查：flake8 + mypy ──────────────────────────────────
    # 在运行测试之前先进行代码质量检查，尽早发现风格和类型问题
    - name: Run flake8 linting
      run: |
        # 检查 concurrent_monitor/ 和 llm_coding_assistant/ 目录的代码风格
        flake8 concurrent_monitor/ llm_coding_assistant/ \
          --count --select=E9,F63,F7,F82 --show-source --statistics
        # E9/F63/F7/F82: 仅报告致命语法错误和导入错误
        echo "flake8 致命错误检查通过"
        # 完整风格检查（非阻塞，仅输出警告）
        flake8 concurrent_monitor/ llm_coding_assistant/ \
          --count --exit-zero --max-complexity=10 --max-line-length=100 --statistics \
          || echo "flake8 风格警告已输出（非阻塞）"

    - name: Run mypy type checking
      run: |
        # 对 concurrent_monitor/ 和 llm_coding_assistant/ 进行类型检查
        mypy concurrent_monitor/ --ignore-missing-imports --no-error-summary || true
        mypy llm_coding_assistant/ --ignore-missing-imports --no-error-summary || true
        echo "mypy 类型检查完成（非阻塞模式）"

    - name: Set library path (Ubuntu/macOS)
      if: runner.os != 'Windows'
      run: |
        echo "LV00_LIBRARY_PATH=$PWD/build/liblv00.so" >> $GITHUB_ENV
        if [ "${{ runner.os }}" == "macOS" ]; then
          echo "LV00_LIBRARY_PATH=$PWD/build/liblv00.dylib" >> $GITHUB_ENV
        fi

    - name: Set library path (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        echo "LV00_LIBRARY_PATH=$PWD/build/liblv00.dll" | Out-File -FilePath $env:GITHUB_ENV -Append

    - name: Run Python tests
      working-directory: python
      run: |
        pytest tests/ -v --cov=lv00 --cov-report=xml

    - name: Run concurrent_monitor tests
      working-directory: concurrent_monitor
      run: |
        python -m pytest tests/ -v

    - name: Run llm_coding_assistant tests
      working-directory: llm_coding_assistant
      run: |
        python -m pytest tests/ -v || echo "No tests yet"

    - name: Upload coverage
      uses: codecov/codecov-action@v5
      with:
        files: python/coverage.xml
        flags: python
        fail_ci_if_error: false

    - name: Run example
      working-directory: python
      run: |
        python examples/basic_usage.py

name: Performance Benchmark

on:
  push:
    branches: [master, dev]
  pull_request:
    branches: [master, dev]
  workflow_dispatch:

jobs:
  benchmark:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake libgmp-dev python3
    
    - name: Configure CMake (Release)
      run: cmake -B build -DCMAKE_BUILD_TYPE=Release
    
    - name: Build
      run: cmake --build build --parallel
    
    - name: Run benchmarks
      run: |
        python3 tool/scripts/benchmark.py --build-dir build --output-dir log/benchmark_results
    
    - name: Download baseline
      uses: actions/download-artifact@v4
      with:
        name: benchmark-baseline
        path: baseline/
      continue-on-error: true
    
    - name: Compare with baseline
      if: hashFiles('baseline/*.json') != ''
      run: |
        python3 tool/scripts/benchmark.py \
          --build-dir build \
          --output-dir log/benchmark_results \
          --compare-with baseline/*.json
    
    - name: Upload benchmark results
      uses: actions/upload-artifact@v4
      with:
        name: benchmark-results
        path: log/benchmark_results/
    
    - name: Store as baseline
      if: success() && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/dev')
      uses: actions/upload-artifact@v4
      with:
        name: benchmark-baseline
        path: log/benchmark_results/*.json
        overwrite: true
    
    - name: Comment PR
      if: github.event_name == 'pull_request'
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          const path = require('path');
          
          const resultsDir = 'log/benchmark_results';
          const files = fs.readdirSync(resultsDir).filter(f => f.endsWith('.md'));
          
          if (files.length === 0) return;
          
          const content = fs.readFileSync(path.join(resultsDir, files[0]), 'utf8');
          
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: '## Performance Benchmark Results\n\n' + content
          });

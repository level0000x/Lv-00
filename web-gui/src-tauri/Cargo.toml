[package]
name = "lv00-gui"
version = "3.0.1"
edition = "2021"

[build-dependencies]
# 锁定到 minor 版本，避免不兼容的补丁/次版本升级导致构建失败
tauri-build = { version = "2.0", features = [] }

[dependencies]
# 锁定到 minor 版本，避免不兼容升级引入破坏性变更
tauri = { version = "2.0", features = ["devtools"] }
tauri-plugin-shell = "2.0"
tauri-plugin-dialog = "2.0"
tauri-plugin-fs = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

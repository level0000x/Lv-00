<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lv-00 编程魔法模拟器</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft YaHei', Arial, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            color: #e8e8e8;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            color: #ffd700;
            text-shadow: 0 0 20px rgba(255, 215, 0, 0.5);
            margin-bottom: 30px;
            font-size: 2.5em;
        }

        .subtitle {
            text-align: center;
            color: #87ceeb;
            margin-bottom: 40px;
            font-size: 1.2em;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .panel {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 15px;
            padding: 25px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
        }

        .panel-title {
            font-size: 1.4em;
            color: #ffd700;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .panel-title::before {
            content: '✧';
            color: #ffd700;
        }

        .element-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 10px;
            margin-bottom: 20px;
        }

        .element-btn {
            padding: 15px 10px;
            border: 2px solid;
            border-radius: 10px;
            cursor: pointer;
            font-size: 0.9em;
            font-weight: bold;
            transition: all 0.3s ease;
            text-align: center;
        }

        .element-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.3);
        }

        .element-btn.fire {
            background: linear-gradient(135deg, #ff4500, #ff6b35);
            border-color: #ff4500;
            color: white;
        }

        .element-btn.water {
            background: linear-gradient(135deg, #00bfff, #1e90ff);
            border-color: #00bfff;
            color: white;
        }

        .element-btn.air {
            background: linear-gradient(135deg, #87ceeb, #b0e0e6);
            border-color: #87ceeb;
            color: #333;
        }

        .element-btn.earth {
            background: linear-gradient(135deg, #8b4513, #a0522d);
            border-color: #8b4513;
            color: white;
        }

        .element-btn.ether {
            background: linear-gradient(135deg, #9932cc, #ba55d3);
            border-color: #9932cc;
            color: white;
        }

        .element-btn.selected {
            box-shadow: 0 0 20px currentColor;
            transform: scale(1.05);
        }

        .rune-list {
            max-height: 200px;
            overflow-y: auto;
            margin-bottom: 15px;
            padding: 10px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 8px;
        }

        .rune-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 12px;
            margin-bottom: 8px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 5px;
            border-left: 3px solid;
        }

        .rune-item.fire { border-color: #ff4500; }
        .rune-item.water { border-color: #00bfff; }
        .rune-item.air { border-color: #87ceeb; }
        .rune-item.earth { border-color: #8b4513; }
        .rune-item.ether { border-color: #9932cc; }

        .rune-name {
            font-weight: bold;
        }

        .rune-power {
            color: #ffd700;
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1em;
            font-weight: bold;
            transition: all 0.3s ease;
            margin: 5px;
        }

        .btn:hover {
            transform: translateY(-2px);
        }

        .btn-primary {
            background: linear-gradient(135deg, #ffd700, #ffaa00);
            color: #1a1a2e;
        }

        .btn-fire {
            background: linear-gradient(135deg, #ff4500, #ff6b35);
            color: white;
        }

        .btn-water {
            background: linear-gradient(135deg, #00bfff, #1e90ff);
            color: white;
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.1);
            color: #e8e8e8;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .spell-list {
            max-height: 300px;
            overflow-y: auto;
        }

        .spell-item {
            padding: 15px;
            margin-bottom: 10px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 2px solid transparent;
        }

        .spell-item:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .spell-item.selected {
            border-color: #ffd700;
            background: rgba(255, 215, 0, 0.1);
        }

        .spell-name {
            font-size: 1.2em;
            color: #ffd700;
            margin-bottom: 5px;
        }

        .spell-desc {
            font-size: 0.9em;
            color: #aaa;
            margin-bottom: 8px;
        }

        .spell-stats {
            display: flex;
            gap: 15px;
            font-size: 0.85em;
        }

        .spell-stat {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .spell-stat-label {
            color: #888;
        }

        .result-panel {
            background: rgba(0, 0, 0, 0.4);
            border-radius: 10px;
            padding: 20px;
            min-height: 200px;
        }

        .result-empty {
            color: #666;
            text-align: center;
            padding: 60px 0;
        }

        .result-success {
            text-align: center;
            padding: 30px;
        }

        .result-success .status {
            font-size: 2em;
            color: #00ff00;
            margin-bottom: 20px;
            text-shadow: 0 0 20px rgba(0, 255, 0, 0.5);
        }

        .result-success .effect {
            font-size: 3em;
            color: #ffd700;
            margin: 20px 0;
            text-shadow: 0 0 30px rgba(255, 215, 0, 0.5);
        }

        .result-failed {
            text-align: center;
            padding: 30px;
        }

        .result-failed .status {
            font-size: 2em;
            color: #ff4500;
            margin-bottom: 20px;
        }

        .result-info {
            margin-top: 20px;
            text-align: left;
        }

        .result-info-row {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .log-panel {
            background: rgba(0, 0, 0, 0.4);
            border-radius: 10px;
            padding: 15px;
            max-height: 400px;
            overflow-y: auto;
            font-family: 'Consolas', monospace;
            font-size: 0.9em;
        }

        .log-entry {
            padding: 5px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .log-time {
            color: #666;
            margin-right: 10px;
        }

        .log-info { color: #87ceeb; }
        .log-success { color: #00ff00; }
        .log-error { color: #ff4500; }
        .log-warning { color: #ffd700; }

        .btn-row {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 15px;
        }

        .input-group {
            margin-bottom: 15px;
        }

        .input-group label {
            display: block;
            margin-bottom: 5px;
            color: #aaa;
        }

        .input-group input, .input-group select {
            width: 100%;
            padding: 10px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 5px;
            background: rgba(0, 0, 0, 0.3);
            color: #e8e8e8;
            font-size: 1em;
        }

        .power-slider {
            width: 100%;
            margin: 10px 0;
        }

        .magic-array-visual {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 10px;
            padding: 20px;
            min-height: 150px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
        }

        .array-rune {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5em;
            font-weight: bold;
            color: white;
            box-shadow: 0 0 15px currentColor;
            animation: pulse 2s infinite;
        }

        .array-rune.fire { background: radial-gradient(circle, #ff4500, #8b0000); color: #ff4500; }
        .array-rune.water { background: radial-gradient(circle, #00bfff, #00008b); color: #00bfff; }
        .array-rune.air { background: radial-gradient(circle, #87ceeb, #4682b4); color: #87ceeb; }
        .array-rune.earth { background: radial-gradient(circle, #8b4513, #3d2b1f); color: #8b4513; }
        .array-rune.ether { background: radial-gradient(circle, #9932cc, #4b0082); color: #9932cc; }

        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.1); opacity: 0.8; }
        }

        .array-connection {
            width: 30px;
            height: 3px;
            background: linear-gradient(90deg, rgba(255,255,255,0.3), rgba(255,255,255,0.6), rgba(255,255,255,0.3));
        }

        .stability-bar {
            width: 100%;
            height: 10px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 5px;
            overflow: hidden;
            margin: 10px 0;
        }

        .stability-fill {
            height: 100%;
            transition: all 0.5s ease;
            border-radius: 5px;
        }

        .stability-high { background: linear-gradient(90deg, #00ff00, #00aa00); }
        .stability-medium { background: linear-gradient(90deg, #ffff00, #ffaa00); }
        .stability-low { background: linear-gradient(90deg, #ff4500, #ff0000); }

        footer {
            text-align: center;
            margin-top: 40px;
            padding: 20px;
            color: #666;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>✦ Lv-00 编程魔法模拟器 ✦</h1>
        <p class="subtitle">基于 Lv-00 核心系统的咒语编程平台 | 轰界四元素体系</p>

        <div class="grid">
            <!-- 符文创建面板 -->
            <div class="panel">
                <div class="panel-title">创建符文</div>

                <div class="element-grid">
                    <button class="element-btn fire" onclick="selectElement('FIRE')">
                        🔥<br>火
                    </button>
                    <button class="element-btn water" onclick="selectElement('WATER')">
                        💧<br>水
                    </button>
                    <button class="element-btn air" onclick="selectElement('AIR')">
                        💨<br>风
                    </button>
                    <button class="element-btn earth" onclick="selectElement('EARTH')">
                        🪨<br>土
                    </button>
                    <button class="element-btn ether" onclick="selectElement('ETHER')">
                        ✨<br>以太
                    </button>
                </div>

                <div class="input-group">
                    <label>符文强度 (1-10)</label>
                    <input type="range" class="power-slider" id="runePower" min="1" max="10" value="5">
                    <span id="powerValue">5</span>
                </div>

                <div class="btn-row">
                    <button class="btn btn-primary" onclick="createRune()">创建符文</button>
                    <button class="btn btn-secondary" onclick="clearRunes()">清空</button>
                </div>
            </div>

            <!-- 魔法阵面板 -->
            <div class="panel">
                <div class="panel-title">魔法阵</div>

                <div class="magic-array-visual" id="arrayVisual">
                    <span style="color: #666;">添加符文到魔法阵...</span>
                </div>

                <div class="stability-bar">
                    <div class="stability-fill stability-high" id="stabilityFill" style="width: 0%;"></div>
                </div>
                <div style="display: flex; justify-content: space-between; font-size: 0.85em;">
                    <span>稳定性:</span>
                    <span id="stabilityValue">0%</span>
                </div>

                <div class="btn-row">
                    <button class="btn btn-secondary" onclick="addToArray()">添加到魔法阵</button>
                    <button class="btn btn-secondary" onclick="createEnhancement()">增强约束</button>
                    <button class="btn btn-secondary" onclick="createConflict()">冲突约束</button>
                </div>
            </div>

            <!-- 咒语选择面板 -->
            <div class="panel">
                <div class="panel-title">咒语书</div>

                <div class="spell-list" id="spellList">
                    <!-- 动态生成 -->
                </div>
            </div>
        </div>

        <div class="grid">
            <!-- 施法面板 -->
            <div class="panel">
                <div class="panel-title">施法</div>

                <div class="result-panel" id="resultPanel">
                    <div class="result-empty">
                        选择咒语并准备好魔法阵后点击"施放咒语"
                    </div>
                </div>

                <div class="btn-row" style="justify-content: center;">
                    <button class="btn btn-fire" onclick="castSpell()" style="padding: 20px 40px; font-size: 1.2em;">
                        ✦ 施放咒语 ✦
                    </button>
                </div>
            </div>

            <!-- 操作日志 -->
            <div class="panel">
                <div class="panel-title">操作日志</div>
                <div class="log-panel" id="logPanel">
                    <div class="log-entry log-info">
                        <span class="log-time">[--:--:--]</span>
                        系统初始化完成...
                    </div>
                </div>
            </div>
        </div>

        <footer>
            <p>Lv-00 编程魔法系统 v3.0.1 | 基于轰界世界观</p>
            <p>符文 → 符号坐标 | 魔法阵 → 约束图 | 咒语 → 函数块</p>
        </footer>
    </div>

    <script src="js/magic_module.js"></script>
    <script>
        // 全局状态
        // 安全说明：以下所有 innerHTML 赋值的数据来源均为内部 Lv00Magic API
        // 返回的受信数据（元素名、咒语名、符文属性等），不涉及用户输入，
        // 因此不存在 XSS 注入风险。若未来接受外部输入，需进行 HTML 转义。
        // 加载校验：magic_module.js 加载失败时，Lv00Magic 为 undefined
        if (typeof Lv00Magic === 'undefined') {
            console.error('[MagicTest] magic_module.js 加载失败，魔法模拟器无法运行');
            document.body.innerHTML = '<div style="color:#f44336;text-align:center;padding:100px 20px;">' +
                '<h2>模块加载失败</h2>' +
                '<p>magic_module.js 未能成功加载，请检查文件是否存在或网络连接是否正常。</p>' +
                '</div>';
            throw new Error('Lv00Magic module not loaded');
        }
        var magic = Lv00Magic.createMagic();
        var currentElement = Lv00Magic.Element.FIRE;
        var currentRunePower = 5;
        var runes = [];
        var currentArray = magic.createArray();
        var spellBook = magic.createStarterSpellBook();
        var selectedSpell = null;

        // 初始化
        function init() {
            renderSpellList();
            updateArrayVisual();
            updateStability();

            document.getElementById('runePower').addEventListener('input', function(e) {
                currentRunePower = parseInt(e.target.value);
                document.getElementById('powerValue').textContent = currentRunePower;
            });
        }

        // 选择元素
        function selectElement(element) {
            currentElement = Lv00Magic.Element[element];

            document.querySelectorAll('.element-btn').forEach(function(btn) {
                btn.classList.remove('selected');
            });
            // 显式传入 event 参数，避免依赖隐式全局 event 对象
            var e = window.event;
            if (e && e.target) {
                e.target.closest('.element-btn').classList.add('selected');
            }
            addLog('选择元素: ' + Lv00Magic.ElementName[currentElement], 'info');
        }

        // 创建符文
        function createRune() {
            var rune = magic.createRationalRune(1, 1, currentElement);
            magic.setRunePower(rune, currentRunePower);
            runes.push(rune);

            var elementName = Lv00Magic.ElementName[currentElement].toLowerCase();
            addLog('创建' + elementName + '符文 (强度: ' + rune.power + ')', 'info');

            updateRuneList();
        }

        // 更新符文列表
        function updateRuneList() {
            var list = document.getElementById('runeList') || createRuneList();
            list.innerHTML = '';

            runes.forEach(function(rune, index) {
                var item = document.createElement('div');
                item.className = 'rune-item ' + Lv00Magic.ElementName[rune.element].toLowerCase();
                item.innerHTML = '<span class="rune-name">' +
                    Lv00Magic.ElementName[rune.element] + '符文 #' + (index + 1) +
                    '</span><span class="rune-power">⚡ ' + rune.power + '</span>';
                list.appendChild(item);
            });
        }

        // 创建符文列表容器
        function createRuneList() {
            var container = document.querySelector('.panel:first-child');
            var list = document.createElement('div');
            list.className = 'rune-list';
            list.id = 'runeList';
            container.appendChild(list);
            return list;
        }

        // 清空符文
        function clearRunes() {
            runes = [];
            updateRuneList();
            addLog('清空所有符文', 'warning');
        }

        // 添加到魔法阵
        function addToArray() {
            if (runes.length === 0) {
                addLog('请先创建符文', 'error');
                return;
            }

            var rune = runes.shift();
            magic.addRuneToArray(currentArray, rune);

            updateRuneList();
            updateArrayVisual();
            updateStability();

            addLog('符文添加到魔法阵 (符文数: ' + currentArray.runes.length + ')', 'info');
        }

        // 创建增强约束
        function createEnhancement() {
            if (currentArray.runes.length < 2) {
                addLog('需要至少2个符文', 'error');
                return;
            }
            var lastId = currentArray.runes.length - 1;
            magic.addConstraintToArray(currentArray, Lv00Magic.ArrayConstraint.ENHANCEMENT, lastId - 1, lastId);
            addLog('添加增强约束', 'success');
            updateStability();
        }

        // 创建冲突约束
        function createConflict() {
            if (currentArray.runes.length < 2) {
                addLog('需要至少2个符文', 'error');
                return;
            }
            var lastId = currentArray.runes.length - 1;
            magic.addConstraintToArray(currentArray, Lv00Magic.ArrayConstraint.CONFLICT, lastId - 1, lastId);
            addLog('添加冲突约束', 'warning');
            updateStability();
        }

        // 更新魔法阵可视化
        function updateArrayVisual() {
            var visual = document.getElementById('arrayVisual');
            visual.innerHTML = '';

            if (currentArray.runes.length === 0) {
                visual.innerHTML = '<span style="color: #666;">添加符文到魔法阵...</span>';
                return;
            }

            currentArray.runes.forEach(function(rune, index) {
                var runeEl = document.createElement('div');
                var elementName = Lv00Magic.ElementName[rune.element].toLowerCase();
                var symbols = {
                    'FIRE': '🔥',
                    'WATER': '💧',
                    'AIR': '💨',
                    'EARTH': '🪨',
                    'ETHER': '✨',
                    '无属性': '❓'
                };

                runeEl.className = 'array-rune ' + elementName;
                runeEl.textContent = symbols[Lv00Magic.ElementName[rune.element]];
                runeEl.title = Lv00Magic.ElementName[rune.element] + '符文 #' + (index + 1);
                visual.appendChild(runeEl);

                // 添加连接线
                if (index < currentArray.runes.length - 1) {
                    var connection = document.createElement('div');
                    connection.className = 'array-connection';

                    // 检查是否有约束
                    var hasConstraint = currentArray.constraints.some(function(c) {
                        return (c.rune1 === index && c.rune2 === index + 1);
                    });

                    if (hasConstraint) {
                        var constraint = currentArray.constraints.find(function(c) {
                            return (c.rune1 === index && c.rune2 === index + 1);
                        });
                        if (constraint && constraint.type === Lv00Magic.ArrayConstraint.CONFLICT) {
                            connection.style.background = 'linear-gradient(90deg, #ff4500, #ff0000, #ff4500)';
                        }
                    }

                    visual.appendChild(connection);
                }
            });
        }

        // 更新稳定性显示
        function updateStability() {
            var stability = magic.calculateArrayStability(currentArray);
            var fill = document.getElementById('stabilityFill');
            var value = document.getElementById('stabilityValue');

            fill.style.width = (stability * 100) + '%';
            value.textContent = (stability * 100).toFixed(1) + '%';

            fill.className = 'stability-fill';
            if (stability > 0.7) {
                fill.classList.add('stability-high');
            } else if (stability > 0.4) {
                fill.classList.add('stability-medium');
            } else {
                fill.classList.add('stability-low');
            }
        }

        // 渲染咒语列表
        function renderSpellList() {
            var list = document.getElementById('spellList');
            list.innerHTML = '';

            var spellNames = spellBook.list();
            spellNames.forEach(function(name) {
                var spell = spellBook.get(name);
                var info = magic.getSpellInfo(spell);

                var item = document.createElement('div');
                item.className = 'spell-item';
                item.onclick = function() { selectSpell(spell); };

                item.innerHTML = '<div class="spell-name">' + info.name + '</div>' +
                    '<div class="spell-desc">' + info.description + '</div>' +
                    '<div class="spell-stats">' +
                    '<div class="spell-stat">' +
                    '<span class="spell-stat-label">难度:</span>' +
                    '<span>' + info.difficultyName + '</span>' +
                    '</div>' +
                    '<div class="spell-stat">' +
                    '<span class="spell-stat-label">元素:</span>' +
                    '<span>' + info.element + '</span>' +
                    '</div>' +
                    '<div class="spell-stat">' +
                    '<span class="spell-stat-label">纯度:</span>' +
                    '<span>' + info.purity + '</span>' +
                    '</div>' +
                    '</div>';

                list.appendChild(item);
            });
        }

        // 选择咒语
        function selectSpell(spell) {
            selectedSpell = spell;

            document.querySelectorAll('.spell-item').forEach(function(item) {
                item.classList.remove('selected');
            });
            // 显式传入 event 参数，避免依赖隐式全局 event 对象
            var ev = window.event;
            if (ev && ev.target) {
                ev.target.closest('.spell-item').classList.add('selected');
            }
            addLog('选择咒语: ' + spell.name, 'info');
        }

        // 施放咒语
        function castSpell() {
            if (!selectedSpell) {
                addLog('请先选择咒语', 'error');
                return;
            }

            if (currentArray.runes.length === 0) {
                addLog('请先准备魔法阵', 'error');
                return;
            }

            addLog('开始施放: ' + selectedSpell.name, 'info');

            var result = magic.castSpell(selectedSpell, currentArray);

            displayResult(result);
        }

        // 显示结果
        function displayResult(result) {
            var panel = document.getElementById('resultPanel');

            if (result.status === Lv00Magic.Status.SUCCESS) {
                panel.innerHTML = '<div class="result-success">' +
                    '<div class="status">✦ 施法成功 ✦</div>' +
                    '<div class="effect">' + result.effect.finalEffect + '</div>' +
                    '<div>最终效果值</div>' +
                    '<div class="result-info">' +
                    '<div class="result-info-row"><span>基础效果</span><span>' + result.effect.baseEffect + '</span></div>' +
                    '<div class="result-info-row"><span>元素加成</span><span>+' + (result.effect.elementBonus * 100).toFixed(1) + '%</span></div>' +
                    '<div class="result-info-row"><span>纯度加成</span><span>×' + result.effect.purityBonus.toFixed(2) + '</span></div>' +
                    '<div class="result-info-row"><span>能量等级</span><span>' + result.effect.energy + ' E_u</span></div>' +
                    '<div class="result-info-row"><span>射程</span><span>' + result.effect.range + '</span></div>' +
                    '<div class="result-info-row"><span>伤害</span><span>' + result.effect.damage + '</span></div>' +
                    '</div>' +
                    '</div>';

                addLog('施法成功! 效果值: ' + result.effect.finalEffect, 'success');

            } else if (result.status === Lv00Magic.Status.BACKLASH) {
                panel.innerHTML = '<div class="result-failed">' +
                    '<div class="status">⚠ 反噬 ⚠</div>' +
                    '<div>' + result.message + '</div>' +
                    '</div>';

                addLog('反噬! ' + result.message, 'warning');

            } else {
                panel.innerHTML = '<div class="result-failed">' +
                    '<div class="status">✗ 施法失败 ✗</div>' +
                    '<div>' + result.message + '</div>' +
                    '</div>';

                addLog('施法失败: ' + result.message, 'error');
            }
        }

        // 添加日志
        function addLog(message, type) {
            var panel = document.getElementById('logPanel');
            var time = new Date().toLocaleTimeString();

            var entry = document.createElement('div');
            entry.className = 'log-entry log-' + type;
            entry.innerHTML = '<span class="log-time">[' + time + ']</span> ' + message;

            panel.insertBefore(entry, panel.firstChild);
        }

        // 初始化
        init();
    </script>
</body>
</html>
